[package]
name = "thia-server"
description = "thia's server: accounts, drafts synced and validated, MCP, publishing lessons"
edition.workspace = true
version.workspace = true

[dependencies]
gestalts-account.workspace = true
gestalts-core.workspace = true
gestalts-fs.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
thiserror.workspace = true
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
include_dir = "0.7"
mime_guess = "2"
regex = "1"
similar = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "sync", "io-util", "fs"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
