# The public site: every view in it, each opened on one of its decks, for anyone, without signing in. Workshop results
# accepted in review are added here (web/server, promote.rs). Its models are also what published lessons, played under
# /l/<lesson>, may read besides the core's and their own: a superset of the lessons' (web/app/distributions/lessons.yml, checked).
id: site
# every view loads only what the build bundled: nothing from elsewhere at run time
pinned_npm: true
plugins:
  - ../../plugins/alphabet-pronunciation-trainer
  - ../../plugins/phrasebook
  - ../../plugins/math-drills
  - ../../plugins/world-map
  - ../../plugins/flags-practice
  - ../../plugins/vietnamese-typing-practice
  - ../../plugins/vizint
models:
  - ../../gestalts/media
  - ../../gestalts/geography
  - ../../gestalts/typing
  - ../../gestalts/viz
# curricula and guides, each a tree whose entries list the views above that practise what they're about (the build
# works it out from the decks' deck@3 concepts)
outlines:
  - ../../outlines/de-ni-gym-mathe-2015
  - ../../outlines/us-ccss-math-2010
# as in the web app (web/app/distributions/home.yml): only for our own views, which load nothing at run time
grants:
  phrasebook: [same-origin, microphone]
