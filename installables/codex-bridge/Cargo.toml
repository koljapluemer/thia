[package]
name = "gestalts-codex-bridge"
description = "Lets a website you allow run the Codex CLI on this computer, with the website's tools"
edition.workspace = true
version.workspace = true

[[bin]]
name = "gestalts-codex-bridge"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "sync", "time", "signal", "fs"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
auto-launch = "0.6"
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"
tao = "0.37"

[dev-dependencies]
tokio-tungstenite = "0.29"
tempfile = "3"

[package.metadata.packager]
product-name = "gestalts-codex-bridge"
identifier = "com.koljasam.gestalts-codex-bridge"
category = "DeveloperTool"
description = "Lets a website you allow run Codex CLI on this computer"
icons = ["../claude-bridge/assets/icon.png"]
authors = ["Kolja Sam"]
publisher = "Kolja Sam"
before-packaging-command = "cargo build --release -p gestalts-codex-bridge"
out-dir = "../../target/packages"

[package.metadata.generate-rpm]
name = "gestalts-codex-bridge"
summary = "Lets a website you allow run Codex CLI on this computer"
license = "proprietary"
assets = [
  { source = "../../target/release/gestalts-codex-bridge", dest = "/usr/bin/gestalts-codex-bridge", mode = "755" },
  { source = "assets/gestalts-codex-bridge.desktop", dest = "/usr/share/applications/gestalts-codex-bridge.desktop", mode = "644" },
  { source = "../claude-bridge/assets/icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/gestalts-codex-bridge.png", mode = "644" },
]
