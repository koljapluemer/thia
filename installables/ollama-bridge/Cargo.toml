[package]
name = "gestalts-ollama-bridge"
description = "Lets a website you allow run an Ollama model on this computer, with the website's tools (experimental)"
edition.workspace = true
version.workspace = true

[[bin]]
name = "gestalts-ollama-bridge"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
tempfile = "3"
