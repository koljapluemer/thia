id: outline-entry-dc440470b0f5c30e
gestalt: outline-entry@1
label: Understand that a function from one set (called the domain) to another set (called the range) assigns to each element of the domain exactly one element of the range. If f is a function and x is an element of its domain, then f(x) denotes the output of f corresponding to the input x. The graph of f is the graph of the equation y = f(x).
notation: HSF-IF.A.1
kind: standard
